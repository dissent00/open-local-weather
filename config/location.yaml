# Open Local Weather — location config for this deployment (Kisumu, Kenya).
#
# See location.example.yaml for field-by-field documentation. This is the
# real, live config for the first deployment of this project — a direct port
# of the LOCATION block from the original Apps Script pipeline
# (KisumuForecastPipeline_v2.gs).

location:
  region_name: "Nyanza Basin"
  primary_place_name: "Kisumu, Kenya"
  timezone: "Africa/Nairobi"

  primary_point:
    lat: -0.0917
    lon: 34.7680

  # THE WATER KISUMU'S BOATS ARE ACTUALLY ON, moved 2026-09-09.
  #
  # This was -0.75, 33.15 — open Lake Victoria, 194 km away and outside the
  # Winam Gulf entirely. Two independent harness readers flagged its
  # temperatures as implausible before anyone checked the distance; they were
  # not implausible, they were a different climate. Measured the same day:
  # the old point forecast a high of 18.5 C while the gulf off Kisumu was
  # 28.0 C and the city 31.1 C. The boaters' section had been describing
  # water 9.5 C colder than the water anyone reads it for.
  #
  # Wind was the half that survived — 36.3 against 36.6 km/h — which is why
  # nothing looked wrong for as long as it did.
  #
  # These coordinates resolve to an over-water cell 12.9 km WSW of the city,
  # elevation 1133 m, which is lake surface. Candidates further out return
  # cells as cold as 19.5 C on the same day, the same signature as the old
  # point, so nearer is both more relevant and more plausible here.
  secondary_point:
    enabled: true
    name: "Winam Gulf"
    section_label: "Conditions for Boaters"
    lat: -0.15
    lon: 34.65

  region_points:
    - name: "Siaya"
      lat: 0.0607
      lon: 34.2881
    - name: "Homa Bay"
      lat: -0.5273
      lon: 34.4571
    - name: "Kisii"
      lat: -0.6773
      lon: 34.7796
    - name: "Migori"
      lat: -1.0634
      lon: 34.4731

  metar_station_icao: "HKKI"
  metar_station_name: "Kisumu International Airport"

  # WHAT THIS DEPLOYMENT CALLS A DEVIATION WORTH MENTIONING — ROADMAP item 145.
  #
  # Commented out because the defaults are what almost every deployment wants,
  # and because an absent key and a key set to its default are different
  # statements: the first says "we did not decide", the second says "we did".
  #
  # REPORTING ONLY. Nothing here can change what a run SPENDS on LLM calls.
  # That is enforced, not promised: the spending decision reads a constant no
  # configuration reaches, and a test sweeps these values across their whole
  # range asserting the spend never moves. It is separated because this
  # project is for people who will not be buying an API key, and a setting
  # that quietly multiplies paid calls fails exactly that reader.
  #
  # It also cannot change what is SCORED. A band decides what a reader is
  # TOLD; two deployments with different bands still agree about the accuracy
  # of the same forecast, and a test asserts the scoring code cannot see one.
  #
  #   low_c          how far the station's overnight low must sit from the
  #                  forecast before it earns a footnote. Default 3.0.
  #                  MEASURED HERE AND LEFT WIDE ON PURPOSE: the blend's Day+0
  #                  low error averages -0.21 C and the station runs -0.05 C
  #                  against reanalysis, so 3.0 is about twelve times the
  #                  expected gap and will rarely fire. That is right for
  #                  someone walking to work and wrong for someone whose crop
  #                  is frost-tender, which is why it is a setting and not
  #                  another guess of ours.
  #   low_freezing_c the same, at or below 4 C, where two degrees stops being
  #                  nothing and becomes ice or no ice. Default 1.0.
  #
  # Set one without the other; an unset field keeps its default rather than
  # inheriting whatever you wrote beside it.
  #
  # deviation_bands:
  #   low_c: 1.5
  #   low_freezing_c: 0.5
  #   high_c: 2.0      # how far above the called high the station must sit
  #   onset_min: 60    # how many minutes earlier than called the rain must start

  # Verified manually at waqi.info (aqicn.org). Kisumu Airport carried over
  # from the Apps Script config; Ochieng' Avenue and Dunga Beach added to
  # give the AQI range some real geographic spread across the city.
  waqi_stations:
    - name: "Kisumu Airport"
      station_id: "A418534"
    - name: "Ochieng' Avenue, Kisumu Central"
      station_id: "A418300"
    - name: "Dunga Beach"
      station_id: "A418504"

  # KMD's DAILY forecast, not the weekly one. Issued ~3pm for 9pm-to-9pm the
  # following day, so it is a genuine Day+0 prediction that can be scored
  # against the numerical models on equal terms. The weekly bulletin's entry
  # for a given day can be up to six days stale, and its PDF is periodically
  # published as scanned images with no extractable text.
  # Hard ceiling on LLM calls per rolling 24 hours. Enforced in code before
  # each call, counting attempts rather than forecasts — one forecast can
  # cost several calls if a provider is flaky. The run FAILS if this is hit,
  # loudly, rather than skipping quietly.
  #
  # Two forecasts a day on this deployment's schedule, up to eight calls if
  # every attempt retries to the limit, so 10 leaves headroom while making a
  # runaway loop impossible.
  # Raised from 10 to 16 on 2026-09-03, and the reason it STAYS raised is not
  # the reason it was raised. The hypothesis was that a 60-second request
  # timeout fired part-way through generation, so retries were consuming the
  # cap. That was tested and is FALSE: the same prompt that had just failed
  # four times succeeded in 32.9s with the ceiling lifted to 180s. Generation
  # is comfortably inside 60s and the timeout is not marginal.
  #
  # What the retries actually are is Gemini being intermittently unavailable
  # — 503s and connections that never answer. Those are real, they recur, and
  # each one is a billable request the cap must count. A bad day is therefore
  # 2 runs x 4 attempts = 8, and 10 left no room for a manual run or a replay.
  # 16 absorbs a bad day and still sits under the account's real 20/day quota.
  # See ROADMAP item 66.
  # RAISED 16 -> 20 on 2026-09-15, TEMPORARILY, and the operator's own words
  # are the reason to put it back: "That's the real number, not what I want to
  # use but fine for this testing period."
  #
  # 20 is Google's actual RPD, so this cap now protects nothing on a normal
  # day — it only stops a runaway loop. It was raised because 16 would have
  # refused the evening issuance of 2026-09-15 before it made a single call:
  # the rolling window held 14, thirteen of them 503 failures from the
  # previous evening's run and that morning's, and a forecast needs 2. A cap
  # sized for a healthy day had been filled entirely by an unhealthy one, and
  # would have blocked the measurement set up to diagnose it.
  #
  # THE TARGET IS 2 PER RUN, not 8. Eight is four attempts times two calls,
  # the retry storm, and it is what makes this project unusable for people
  # whose whole daily allowance it would eat. Put this back to 16 — or lower
  # — once the provider change is measured; the reason 16 was chosen has not
  # stopped being true, it is just suspended.
  #
  # Rolling 24h at 20 is still at least as strict as Google's calendar-day
  # 20, since any calendar day is itself a 24-hour window. What it does NOT
  # cover is requests made outside the pipeline: the probes in tools/ call the
  # endpoint directly and are not in the ledger.
  max_llm_calls_per_24h: 20

  # WHICH API THIS DEPLOYMENT TALKS TO. Moved out of code and out of GitHub
  # repository variables on 2026-09-15 — neither was a place an operator
  # looks, and a variable changed in a browser leaves no diff, no commit
  # message and no history.
  #
  # Only the FIRST entry is used. The list shape is here because ROADMAP item
  # 81's fallback question is answered by an ORDER, and a single string would
  # have to be migrated to express one; loading a second entry prints a
  # warning saying it is ignored.
  #
  # `gemini` (generateContent) AGAIN since 2026-09-25, after ten days on
  # `gemini-interactions` — ROADMAP item 179. The switch was made to escape
  # 503s and did not: 29 of 35 Interactions requests in the 15:01Z slot were
  # 503s. It did change the bill. From the switch on, every UTC-8 quota day
  # with a failing evening reached Google's "20 requests per day" after 6 or
  # 7 of our requests — about three units each, if nothing else used the
  # key — so one bad 15:01Z run spent the day and the next 03:01Z run got
  # 429s. This revert is also the test:
  # if the console's "Requests per model" now tracks our ledger 1:1, the
  # endpoint was the multiplier.
  llm_providers:
    - gemini
    # ROADMAP item 81, 2026-09-21. The second entry is a CHAIN, not a
    # replacement: Gemini answers when it can, and this takes the calls it
    # sheds. Measured over 2026-08-28 to 09-21, the 15:01 slot failed on
    # Gemini 500s and 503s five times in 29 runs and the 03:01 slot never did
    # in 25 (one-sided Fisher p = 0.038), always after four attempts across
    # roughly eight and a half minutes — long enough that no retry schedule
    # this project would accept could have saved them.
    #
    # INERT UNTIL THE KEYS EXIST. With no LLM_API_KEY the entry is dropped and
    # the run says so on stderr, which is the intended reading: a fallback
    # that is configured and not yet reachable. Set LLM_API_KEY as a secret
    # and LLM_BASE_URL and LLM_MODEL as repository variables to arm it.
    - openai

  # What the gateway itself tries, in order, inside ONE request — OpenRouter's
  # `models` field. Different from the list above, which is the order this
  # project walks between VENDORS; this order never leaves the gateway.
  #
  # ALL THREE ARE FREE TIERS and none is Gemini 3.6 Flash's equal; that was
  # understood when they were chosen. Checked against OpenRouter's live model
  # list on 2026-09-21: of 446 models, 24 are free, and there is no free Grok,
  # Mistral, DeepSeek, Llama or Gemini among them. These three are the ones
  # that advertise `response_format` with structured outputs AND hold the
  # ~56,000-token prompt this project sends:
  #
  #   nemotron-3-super   120B MoE, 12B active, 262k context
  #   dots-3-note        280B MoE, 16B active, 512k context
  #   gemma-4-31b        30.7B dense, 262k context, closest to the incumbent
  #                      by family, and `response_format` without strict
  #                      structured outputs — the last resort of the three
  #
  # The free tier allows 20 requests a minute and 50 a day, against the four
  # calls a day this deployment makes, so the ceiling is not the constraint.
  # FREE TIERS ONLY, AND THAT IS A PROJECT CONSTRAINT RATHER THAN A BUDGET.
  # Stated by the operator 2026-09-22: "think of the OLW user with limited
  # resources". Anyone can run this deployment's exact configuration without
  # an account that bills, and a fallback that quietly costs money would make
  # that untrue for the reader who most needs it to hold. The paid options
  # were priced the same day — the chain fires only when the primary is down,
  # a few tens of runs a year, so the bill would have been under a dollar —
  # and the constraint is not about the amount.
  #
  # THE FIRST LINK IS `LLM_MODEL`, not this list. The request carries
  # `models: [LLM_MODEL, *these]`, so these are the SECOND and THIRD tries
  # and naming the primary here again would just send it twice.
  #
  # Both carry `structured_outputs` AND `response_format` on OpenRouter's own
  # model list, checked 2026-09-22. That pairing is the filter that matters:
  # `require_parameters` is sent whenever this list is non-empty, so routing
  # is restricted to upstreams that honour the schema, and a model without
  # strict support is dead weight in the list rather than a safety net.
  #
  # `google/gemma-4-31b-it:free` WAS THIRD AND WAS DROPPED for exactly that:
  # it advertises `response_format` and NOT `structured_outputs`. It was
  # chosen on 09-21 as "the last resort of the three" when the free set was
  # thinner; `nex-n2.5-pro` now does the same job without the caveat.
  # `qwen/qwen3.8-27b:free` is strict but does not advertise
  # `response_format` at all, which is the field this project actually sends.
  llm_fallback_models:
    - "dots-studio/dots-3-note-preview:free"
    - "nex-agi/nex-n2.5-pro:free"

  # THE FALLBACK MAKES THE SCORED CALL AND NOTHING ELSE — operator's decision
  # 2026-09-25, ROADMAP item 180. It made the scored call 2 of 2 times and
  # wrote the narrative 1 of 5, and each narrative it failed spent up to two
  # 1700s deadlines before the issuance degraded anyway. So the narrative is
  # Gemini's alone, and a Gemini failure there publishes the scored forecast
  # without its write-up at once rather than an hour later.
  llm_fallback_calls: scored_call

  local_bulletin_url: "https://meteo.go.ke/our-products/daily-forecast/"
  # The national CAP warning feed — ROADMAP item 2. Verified live
  # 2026-09-03; its newest alert was four months old, which is why
  # check-health watches it rather than the pipeline depending on it.
  cap_feed_url: "https://meteo.go.ke/api/cap/rss.xml"
  local_bulletin_source_name: "Kenya Meteorological Department (KMD)"
  # The county KMD indexes this location under, and the name its skill is
  # tracked under on the accuracy page.
  # Investigated coverage gaps that are genuine properties of the data, not
  # faults — see docs-internal and `olw check-health`. Recorded so the weekly
  # check reports only things that have changed.
  acknowledged_coverage_gaps:
    - model: "icon_seamless"
      lead_time_days: 7
      reason: "ICON's forecast horizon ends around 7.5 days, so Day+7 is beyond it. Documented in README's known limitations."
      since: 2026-08-20
    - model: "ukmo_seamless"
      lead_time_days: 7
      reason: "UKMO's forecast horizon ends around 7.2 days, so Day+7 is beyond it. Documented in README's known limitations."
      since: 2026-08-20
    - model: "kenya_met"
      lead_time_days: 0
      variable: "wind_kmh"
      reason: "KMD's county table publishes rain and temperature only; no wind figure exists to extract."
      since: 2026-08-20
    - model: "kenya_met"
      lead_time_days: 0
      variable: "mslp_trend"
      reason: "KMD publishes no pressure figure per county."
      since: 2026-08-20
    - model: "kenya_met"
      lead_time_days: 3
      variable: "wind_kmh"
      reason: "As Day+0 — the five-day grid carries weather and temperature only."
      since: 2026-08-20
    - model: "kenya_met"
      lead_time_days: 3
      variable: "mslp_trend"
      reason: "As Day+0 — no pressure figure published."
      since: 2026-08-20

    # The blend and the baselines. Every entry below is a null this project
    # WRITES on purpose, each with its reason beside the code that writes it.
    # Listed per VARIABLE rather than per lead: omitting `variable` would
    # cover the whole (model, lead) and would also silence `rain`, which these
    # models do supply and whose disappearance should be reported.
    - model: "olw_blend"
      lead_time_days: 0
      variable: "wind_kmh"
      reason: "today_properties.peak_wind_kmh is the SECONDARY point's wind; scoring it against the primary point's observation would compare two different places. Deliberately null in _blend_prediction."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 0
      variable: "mslp_trend"
      reason: "mslp_trend_24h is prose in the schema, not a number. Null reads as 'not forecast', which is the truthful answer until it is structured. See _blend_prediction."
      since: 2026-09-07

    # ROADMAP item 72, shipped 2026-09-05. Beyond Day+0 the forecaster is
    # asked for rain and rain_probability_pct and nothing else, so every other
    # field is absent rather than zero — a guessed boolean is scored wrong
    # exactly as confidently as a real one. These appeared as gaps on the
    # first health check after that shipped, 2026-09-07.
    - model: "olw_blend"
      lead_time_days: 3
      variable: "wind_kmh"
      reason: "Item 72: not asked for beyond Day+0. A value here would enter the record as a commitment the forecaster never made."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 3
      variable: "high_c"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 3
      variable: "low_c"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 3
      variable: "mslp_trend"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 7
      variable: "wind_kmh"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 7
      variable: "high_c"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 7
      variable: "low_c"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07
    - model: "olw_blend"
      lead_time_days: 7
      variable: "mslp_trend"
      reason: "Item 72: not asked for beyond Day+0."
      since: 2026-09-07

    # Climatology averages past OBSERVATIONS, and there is no observed
    # pressure TREND to average — baselines.py sets it null rather than
    # inventing one. Reported for 27 runs, which is every run since it existed.
    - model: "climatology"
      lead_time_days: 0
      variable: "mslp_trend"
      reason: "No observed pressure trend exists to average; climatology_baseline sets it null rather than fabricating one."
      since: 2026-09-07
    - model: "climatology"
      lead_time_days: 3
      variable: "mslp_trend"
      reason: "As Day+0 — nothing to average."
      since: 2026-09-07
    - model: "climatology"
      lead_time_days: 7
      variable: "mslp_trend"
      reason: "As Day+0 — nothing to average."
      since: 2026-09-07

  local_bulletin_area_name: "Kisumu"
  local_bulletin_model_id: "kenya_met"
