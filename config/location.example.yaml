# Open Local Weather — location config
#
# This is the ONLY file you should need to edit to fork this project for a
# new place. Everything else (the system prompt, the fetch calls, the
# narrative sections) is built dynamically from this block. Copy this file to
# config/location.yaml and fill in your own values.
#
# Local met-bulletin scraping is inherently location-specific and can't be
# meaningfully generalized — leave local_bulletin_url empty to skip it, or
# see src/openlocalweather/fetch/bulletin/ for how to write your own.

location:
  # Human-readable names used throughout the narrative and system prompt.
  region_name: "Example Region"
  primary_place_name: "Example Town, Country"
  timezone: "UTC" # any IANA tz name, e.g. "Africa/Nairobi"

  # Main forecast point (a town/city).
  primary_point:
    lat: 0.0
    lon: 0.0

  # Optional second point of interest — a lake, coastline, mountain, etc.
  # Set enabled: false to skip this entire section (data + narrative) for
  # locations without a relevant secondary feature.
  secondary_point:
    enabled: false
    name: ""
    section_label: ""
    lat: 0.0
    lon: 0.0

  # Neighboring points for the regional pressure-gradient snapshot (used in
  # the Synoptic Overview section). 3-6 points spread across the wider area
  # works well; more adds fetch cost without much narrative benefit.
  region_points: []
  # - name: "Neighbor Town"
  #   lat: 0.0
  #   lon: 0.0

  # ICAO code for a nearby airport with METAR reporting. Find yours at
  # https://mesonet.agron.iastate.edu/request/download.phtml (pick your
  # country, then your airport) — coverage is global, not US-only.
  #
  # WORTH REAL EFFORT TO GET RIGHT. This is not just narrative colour. The
  # airport's present-weather reports are scored: a day it reports thunder
  # counts as a day convection occurred, whatever the reanalysis grid cell
  # recorded. That matters because the gridded archive every model is scored
  # against smooths isolated storms into nothing — measured here, 5 of the
  # first 42 days were filed as dry while the airport watched a storm pass
  # over, and the models that called those days correctly were marked wrong
  # for it. See docs-internal/ROADMAP.md item 42.
  #
  # Leave "" if there is genuinely no reporting station near you. Everything
  # still works: `thunder` stays null, which is read as "not observed" and
  # never as "no thunder", and scoring behaves as it did before the field
  # existed. You just lose the only ground truth available for convection.
  #
  # Prefer a station close to your primary point. Thunder ten kilometres away
  # is a different event from thunder overhead, and this cannot tell them
  # apart.
  metar_station_icao: ""

  # Ground air-quality monitoring stations — any number, including zero.
  # `name` is YOUR display name (used everywhere a station is named: the
  # site, the email, the LLM prompt), not WAQI's own city.name, which can be
  # verbose or inconsistent between stations. VERIFY EACH station_id
  # MANUALLY at waqi.info — it cannot be checked from code, and a wrong ID
  # silently poisons the "ground truth" AQI comparison. Leave the list
  # empty to skip ground AQI entirely. With 2+ stations, the narrative
  # states the AQI range and names whichever station is currently worst
  # (computed in code, never left to the LLM — see aqi.py).
  waqi_stations: []
  # - name: "Downtown"
  #   station_id: ""
  # - name: "Airport"
  #   station_id: ""

  # Optional local met-service bulletin. Leave "" to skip gracefully.
  local_bulletin_url: ""
  local_bulletin_source_name: ""
