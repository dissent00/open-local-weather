# SUPERSEDED BY forecast.yml — dispatch-only until the crontab is switched.
#
# One verb now decides what kind of run this is (see forecast.yml and
# pipeline.run_forecast). This file keeps workflow_dispatch so an operator's
# existing crontab line, which names this workflow, keeps working while the
# switch is made. Its `schedule:` block has been REMOVED: forecast.yml carries
# the backstop schedules now, and leaving them here would mean two workflows
# firing at the same minute for the same day.
#
# Sequence, so nothing is broken between steps:
#   1. forecast.yml exists and has run at least once from each slot. [this commit]
#   2. Switch the crontab to it:
#        ops/trigger_workflow.sh          (forecast.yml is the default)
#   3. Confirm a real run from each slot.
#   4. Delete this file and evening_refresh.yml.
# Do NOT delete first: a cron line pointing at a workflow that no longer
# exists fails silently from the crontab's point of view.

name: Evening Forecast Refresh

# Optional same-day update — see docs-internal/ROADMAP.md's "Second daily
# forecast run" section for the full rationale and timing analysis. Fresh
# narrative on a later model cycle, but deliberately does NOT touch the
# accuracy loop: no verification, and the morning run's model_predictions
# are preserved byte-for-byte (see pipeline.run_refresh_pipeline). Requires
# the morning run (daily.yml) to have already run successfully today —
# fails loudly, not silently, if there's nothing to refresh.

# TRIGGERING: two paths, deliberately in different failure domains.
#
# PRIMARY is the operator's own server crontab, calling GitHub's
# workflow_dispatch REST API via ops/trigger_workflow.sh. It exists because
# GitHub's scheduler proved unreliable on this repo: this workflow's
# first-ever scheduled occurrence fired ~56 minutes late with createdAt ==
# startedAt, so the delay was entirely GitHub's side rather than queuing for
# a runner, and daily.yml's schedule produced zero runs at all on two
# separate occasions.
#
# BACKSTOP is the `schedule:` block below. It is NOT redundant with the
# crontab — it is redundant *of a different kind*. The crontab routes around
# GitHub's scheduler; the schedule routes around the server, its token, and
# its network. Either alone is a single point of failure, and the failure is
# quiet: a refresh that never runs produces no error anywhere, and
# health_check.yml only looks weekly.
#
# Overlap is safe and nearly free. The `check` job below exits in seconds
# without calling the model if today's entry is already refreshed, whichever
# trigger got there first.
#
# ~18:07 Africa/Nairobi (EAT) = 15:07 UTC, chosen from the measured
# model-availability table in ROADMAP.md: by 13:19 UTC every model's 06z
# cycle has landed, and the aligned window — all four models on the same
# cycle — holds from 14:00 UTC until just before 19:00 UTC, when the faster
# models jump to 12z. The +15/+30/+45 slots cover a late or dropped
# occurrence. The external cron aims at the same window.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run fetch/LLM for real but skip writes and publish"
        type: boolean
        default: false
      force:
        description: "Force a real run even if today's entry is already refreshed. Leave false for routine automated dispatch (e.g. ops/trigger_workflow.sh) -- true is for deliberately re-refreshing today's forecast by hand."
        type: boolean
        default: false

# Least-privilege default; the `run` job overrides to `write` for the step
# that actually needs it.
permissions:
  contents: read

# Deliberately the SAME group as daily.yml, not a separate one — both
# workflows write to the same data/log/<date>.json file, so if a delayed
# morning run is still in progress when this fires, they need to be
# serialized (queued), not run concurrently and race on that file. Applies
# across BOTH jobs in this workflow together.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  # Cheap, read-only pre-check so a redundant trigger — a backup schedule
  # slot, OR a routine workflow_dispatch call from ops/trigger_workflow.sh
  # (or a hosted cron service — see ops/README.md) — doesn't burn a real
  # Gemini call re-refreshing today's entry a second time for nothing.
  # Checking `meta.refreshed_at`, not just that the day's file exists —
  # that file exists from the morning run regardless of whether the
  # evening refresh has happened yet, so file-existence alone (the check
  # daily.yml uses) isn't the right gate here. Applies to BOTH schedule
  # and workflow_dispatch by default now: an earlier version exempted all
  # workflow_dispatch runs unconditionally, on the assumption a manual
  # dispatch always means "a human deliberately wants this to run for
  # real" — true when workflow_dispatch meant an occasional manual click,
  # false once an external cron calls it routinely every day. Use the
  # `force` input (default false) to explicitly bypass this when you
  # really do want to re-refresh today's forecast by hand.
  check:
    runs-on: ubuntu-latest
    outputs:
      already_done: ${{ steps.check.outputs.already_done }}
    steps:
      - uses: actions/checkout@v7
      - name: Check if today's entry is already refreshed
        id: check
        run: |
          RESULT=$(python3 -c "
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          p = Path(f'data/log/{today}.json')
          if not p.exists():
              print('false')  # nothing to refresh yet — refresh-forecast's own loud failure handles this, not our concern here
          else:
              entry = json.loads(p.read_text())
              print('true' if entry.get('meta', {}).get('refreshed_at') else 'false')
          ")
          echo "Today's entry already refreshed: $RESULT"
          echo "already_done=$RESULT" >> "$GITHUB_OUTPUT"

  run:
    needs: check
    if: needs.check.outputs.already_done != 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Determine public Pages URL
        id: pages_url
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER,,}.github.io/${REPO,,}/" >> "$GITHUB_OUTPUT"

      - name: Run evening refresh
        env:
          # --- LLM provider selection (see QUICKSTART.md) ---
          # Leave all of these unset to use Gemini, the default.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_JSON_MODE: ${{ vars.LLM_JSON_MODE }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # --- Gemini (the default provider) ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Which trigger produced this run. Recorded into the log entry so a
          # dead workflow_dispatch path is visible in the committed record
          # rather than hidden behind the cron slots still firing.
          TRIGGER_SOURCE: ${{ github.event_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          olw refresh-forecast --public-url "${{ steps.pages_url.outputs.url }}" $DRY_RUN_FLAG

      - name: Commit and push data/docs changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "forecast refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
