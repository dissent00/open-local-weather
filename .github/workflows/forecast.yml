name: Forecast

# The day's forecast, whichever run of the day this is.
#
# Replaces daily.yml + evening_refresh.yml. The operator used to pick a
# workflow by time of day, and that was the wrong axis: the real distinction
# is whether today already has an entry. The FIRST run of a day owns
# verification and the day's model_predictions — the numbers tomorrow scores.
# EVERY later run is an update: narrative only, predictions preserved
# byte-for-byte. `olw forecast` reads the day and decides; see
# pipeline.run_forecast.
#
# THERE IS NO `check` JOB, and that is the point. daily.yml gated on the
# day's file existing, evening_refresh.yml on meta.refreshed_at being set —
# two guards, in YAML, on behaviour this repo could not test, and neither
# survived someone ticking `force`. The guard now lives in the pipeline: a
# trigger that repeats one from the last hour returns without calling the
# model, and `force` overrides that and nothing else — since the write-once
# guard it cannot reach the scored numbers. A check job would also have spun
# up a runner, so this costs about the same and removes the YAML logic.
#
# TRIGGERING: one path. The operator's crontab calls GitHub's
# workflow_dispatch REST API via ops/trigger_workflow.sh, at the times and
# for the reasons ops/README.md records.
#
# THERE IS NO `schedule:` BLOCK. That is a decision, not an omission.
#
# Eight backstop slots — 03:07/22/37/52 and 15:07/22/37/52 UTC — were removed
# on 2026-08-29. What they covered was real: the crontab routes around
# GitHub's scheduler, the schedule routed around the operator's server, its
# token and its network, and a run that never happens produces no error
# anywhere while health_check.yml only looks weekly. They were removed
# because the 03:0x family cost more than it covered.
#
# MEASURED, across the whole run history of those four slots under this file
# and daily.yml before it, which carried the identical crons: they have never
# been punctual. 33–52 min late on 2026-08-26; ~11 h late on 2026-08-27
# (14:04–14:34Z); and on both 2026-08-28 and 2026-08-29 a group of four
# landing around 00:00 UTC. The 15:0x family has never been more than ~35
# min out. Which declared slot produced a given run is not knowable — GitHub
# exposes no intended-fire time — so these are arrival times against the
# slots that exist, not a per-slot attribution.
#
# A slot late enough does not run late — it runs as a different kind of run.
# Crossing UTC midnight, those 00:0x arrivals were not yesterday's re-issue;
# they were the FIRST run of the next day, which owns the write-once
# model_predictions the accuracy record scores. Twice running, that day's
# numbers were built on 12-hour-old guidance (2026-08-29: 12z, age 12.03 h)
# rather than the ~9 h a 03:0x run gets from the 02:00 UTC aligned window,
# and the crontab dispatch — on time, 03:01:04Z — could then only re-issue
# the narrative. Every guard in the pipeline behaved correctly. None of them
# is about which trigger gets to be first.
#
# The cost is also a message. The mailer sends on novelty
# (mailer/AppsScriptMailer.gs), so a third issuance is a third email to every
# subscriber. A missed morning is cheaper than that.
#
# ALL EIGHT WENT, not just the four that misbehave. A 15:0x slot delivered
# late enough lands after midnight too — that was the original reading of the
# 2026-08-28 cluster — so keeping the evening four would keep a second
# scheduler able to open a day it was never meant to open.
#
# FORKERS: with no `schedule:` here, this workflow never runs by itself. Give
# it a trigger before relying on it — a free hosted cron service calling the
# dispatch API needs no server of your own (QUICKSTART.md step 9,
# ops/README.md), or add a `schedule:` block back and accept the punctuality
# above.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run fetch/verify/LLM for real but skip writes, commit, publish and email"
        type: boolean
        default: false
      force:
        description: "Re-issue even if a forecast went out in the last hour. Forces the NARRATIVE only -- the day's scored predictions are written once and cannot be reached from here. Leave false for routine automated dispatch (e.g. ops/trigger_workflow.sh)."
        type: boolean
        default: false

# Least-privilege default; the `run` job overrides to `write` for the step
# that actually needs it.
permissions:
  contents: read

# Deliberately the same group daily.yml and evening_refresh.yml used: all
# three write data/log/<date>.json, so a delayed run still in progress when
# the next fires must be queued, not raced.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # With no `ref:`, checkout pins to `github.sha` -- the branch
          # head when THIS RUN WAS CREATED, not when it started. Measured
          # 2026-08-28: runs 33129511456 (created 00:22:32Z) and 33129761608
          # (created 00:27:05Z) were 4m33s apart instead of the 15 minutes
          # the cron slots ask for. The concurrency group correctly queued
          # run 2 behind run 1 -- it started work at ~00:27:48, after run 1
          # had committed and pushed -- but its checkout was still the
          # pre-push SHA. run_forecast (pipeline.py) found no
          # data/log/2026-08-28.json, did a full "first" run (a wasted ~5
          # minute LLM call), and its git push was then rejected as
          # non-fast-forward. Pinning to `main` lets a queued run see what
          # an earlier run in the same group already pushed -- which is
          # what the pipeline's own duplicate-trigger guard
          # (MIN_REISSUE_INTERVAL_MINUTES) needs in order to see the
          # earlier run's commit at all.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Determine public Pages URL
        id: pages_url
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER,,}.github.io/${REPO,,}/" >> "$GITHUB_OUTPUT"

      - name: Forecast
        env:
          # --- LLM provider selection (see QUICKSTART.md) ---
          # Leave all of these unset to use Gemini, the default.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_JSON_MODE: ${{ vars.LLM_JSON_MODE }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # --- Gemini (the default provider) ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Which trigger produced this run. Recorded into the log entry so a
          # dead workflow_dispatch path is visible in the committed record
          # rather than hidden behind the cron slots still firing.
          TRIGGER_SOURCE: ${{ github.event_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          olw forecast --public-url "${{ steps.pages_url.outputs.url }}" $FLAGS \
            | tee "$RUNNER_TEMP/forecast.log"

      - name: Commit and push data/docs changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # The commit subject follows what the run actually did. `olw
          # forecast` prints "run-kind: first|reissue|skipped" as its first
          # line for exactly this — see RUN_KIND_* in cli.py. One subject for
          # both kinds would flatten the archive's own history, and the
          # archive is the product.
          SUBJECT="forecast"
          if grep -q "^run-kind: reissue$" "$RUNNER_TEMP/forecast.log"; then
            SUBJECT="forecast refresh"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "${SUBJECT}: $(date -u +%Y-%m-%d)"

            # Residual race, distinct from the checkout fix above: the
            # `ref: main` pin stops a queued run from missing an earlier
            # run's commit before it starts, but two runs in the same
            # concurrency group can still each commit and then race the
            # push. Rebase, not merge -- each day's write is an independent
            # commit and the archive reads better linear. Bounded retries:
            # a push still failing after real rebases is a different
            # problem and should fail the job, not loop forever.
            PUSHED=0
            for attempt in 1 2 3; do
              if git push; then
                PUSHED=1
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                break
              fi
              echo "git push rejected (attempt $attempt/3); pulling --rebase and retrying" >&2
              # Not guarded: a rebase that CONFLICTS means two runs wrote the
              # same day differently, which is a different problem and ends
              # the step here rather than being retried into a worse state.
              git pull --rebase
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "git push failed after retries" >&2
              exit 1
            fi
          fi
