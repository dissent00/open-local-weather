name: Weekly Health Check

# Decoupled from forecast.yml's own trigger on purpose — a health-check failure
# should never block or depend on that day's forecast run, and vice versa.
# See health_check.py's module docstring for what these checks catch and
# why (in short: a live Gemini deprecations-page read, since a bare
# model-list check missed a real account-tier restriction during initial
# setup; days-since-last-commit, a proxy for "is the forecast actually
# running and pushing," warned at 50 days to give real lead time before
# GitHub's 60-day scheduled-workflow auto-disable; and the aligned-window
# table against one live model-run observation).
#
# The hour matters for that last one: 04:17 UTC is over two hours inside an
# aligned window, where the table and the observation are comparable. A
# check moved to within an hour of 02:00, 08:00, 14:00 or 20:00 UTC would
# report disagreements that are only the table's whole-hour rounding — see
# health_check.check_aligned_window.
on:
  schedule:
    # Deliberately off the exact hour — see forecast.yml's header for why
    # ":00" schedules are the least reliable slot GitHub offers. (daily.yml,
    # which this used to cite, was removed with the backstop slots on
    # 2026-08-29; forecast.yml now carries no `schedule:` block at all.)
    - cron: "17 4 * * 1" # ~04:17 UTC every Monday
  workflow_dispatch:

# The check WRITES now, which it did not before. data/health/status.json is
# what the previous run saw, and without it the check has no memory — every
# run reads the world, prints it and forgets, which is fine for a state and
# wrong for an EVENT. ROADMAP item 2 is gated on one such event (the CAP feed
# waking up) and nothing was going to report it. See store/health_status.py.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Required now that this job PUSHES. With no `ref:`, checkout leaves
          # a detached HEAD at `github.sha` and the commit below would have
          # nowhere to go — the status file would be written, committed to
          # nothing, and the wake-up alarm would re-fire every Monday for the
          # whole season. forecast.yml pins the same way for a related reason
          # (see its checkout comment).
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      # EVERY PROVIDER'S CREDENTIALS, WITHOUT NAMING THEM ONE BY ONE.
      #
      # ROADMAP item 81, 2026-09-22. A chain entry can carry its own
      # `env_prefix`, so `llm_providers` may name OpenRouter and Groq and a
      # fourth gateway, each reading OPENROUTER_*, GROQ_*, ... The env block
      # below used to list LLM_* and GEMINI_* by hand, which meant a third
      # provider was configured in `location.yaml`, built with nothing, and
      # DROPPED FROM THE CHAIN IN SILENCE — the config said three links and
      # the run held two. Adding a provider now needs a config line and its
      # secrets, and no change to this file.
      #
      # THE PATTERN IS AN ALLOWLIST, not a dump of the repository's secrets.
      # It passes only provider-shaped names — anything ending in _API_KEY,
      # _BASE_URL, _MODEL, _FALLBACK_MODELS, _JSON_MODE or _MAX_TOKENS — so
      # `github_token`, WAQI_TOKEN and PUBLIC_WEBPAGE_URL are all excluded.
      # Verified against a fixture of both before this shipped.
      #
      # The heredoc form is used rather than KEY=VALUE because a value
      # containing a newline would otherwise inject arbitrary variables.
      - name: Provider credentials
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # The guard in tests/test_workflows.py sees jq's own `|` operator
          # and cannot tell it from a shell pipe. Setting pipefail anyway is
          # cheaper than teaching it the difference, and correct regardless:
          # a jq that fails here must not leave the chain quietly short.
          set -o pipefail
          emit() {
            jq -r --arg p '^[A-Z0-9_]+_(API_KEY|BASE_URL|MODEL|FALLBACK_MODELS|JSON_MODE|MAX_TOKENS)$' '
              to_entries[]
              | select(.key | test($p))
              | select(.value != null and .value != "")
              | "\(.key)<<__OLW_ENV__\n\(.value)\n__OLW_ENV__"' <<<"$1"
          }
          { emit "$ALL_VARS"; emit "$ALL_SECRETS"; } >> "$GITHUB_ENV"

      - name: Run health checks
        env:
          # --- LLM provider selection (see QUICKSTART.md) ---
          # Leave LLM_PROVIDER unset to use the chain in location.yaml.
          #
          # The keys and per-provider settings are passed by the "Provider
          # credentials" step above, whatever prefix a chain entry names —
          # ROADMAP item 81. Only names that are not provider-shaped stay here.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
        # PIPEFAIL IS LOAD-BEARING, and its absence lost a forecast once
        # already — see ROADMAP item 66 and tests/test_workflows.py.
        run: |
          set -o pipefail
          olw check-health 2>&1 | tee "$RUNNER_TEMP/health.log"

      # ALWAYS, including after a failing check. The wake-up alarm fires on a
      # TRANSITION, so the new status has to be recorded even on the run that
      # just went red — otherwise the same transition is re-detected every
      # week and a signal meant to be seen once becomes a weekly red job
      # nobody reads.
      - name: Commit the health status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/health/
          if git diff --cached --quiet; then
            echo "No status change to commit."
          else
            git commit -m "health: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
