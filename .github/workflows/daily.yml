name: Daily Forecast

on:
  schedule:
    # PRIMARY: ~06:07 Africa/Nairobi (EAT, UTC+3 year-round — no DST) =
    # 03:07 UTC. Deliberately NOT on the hour — GitHub's own docs flag
    # exact-hour schedules (":00") as the highest-congestion slot and warn
    # that "in some cases the scheduled workflow may not run" at all, not
    # just run late.
    #
    # BACKUPS: three more slots at +15/+30/+45 min. This isn't
    # theoretical — confirmed twice now, on this exact workflow:
    #   - 2026-08-12: the original exact-hour "0 3 * * *" never fired at
    #     all on its first occurrence — no run in the history at any
    #     status.
    #   - 2026-08-13: the off-hour "7 3 * * *" fix ALSO never fired on
    #     ITS first occurrence — same complete no-show, not a delay. The
    #     off-hour-minute fix reduces congestion-driven lateness but does
    #     not, by itself, guarantee the schedule event fires at all.
    # Each backup slot is near-free when unneeded — the `check` job below
    # exits in seconds without installing the package or calling Gemini
    # if today's forecast already exists — so redundancy costs almost
    # nothing on a normal day and turns "silently missed entirely" into
    # "arrived up to 45 minutes late," which the mailer's own retry
    # window (mailer/AppsScriptMailer.gs) can still absorb for the more
    # likely case where at least one of the four slots fires close to on
    # time.
    - cron: "7 3 * * *"
    - cron: "22 3 * * *"
    - cron: "37 3 * * *"
    - cron: "52 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run fetch/verify/LLM for real but skip writes, commit, and email"
        type: boolean
        default: false
      force:
        description: "Force a real run even if today's forecast already exists. Leave false for routine automated dispatch (e.g. ops/trigger_workflow.sh) -- true is for deliberately regenerating today's forecast by hand."
        type: boolean
        default: false

# Least-privilege default; the `run` job overrides to `write` for the step
# that actually needs it.
permissions:
  contents: read

# Prevents a slow run overlapping with the next scheduled trigger (or a
# backup slot) from racing on the same data/ files. Applies across BOTH
# jobs in this workflow together, and is deliberately the same group name
# evening_refresh.yml uses — see that file's comment for why.
concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  # Cheap, read-only pre-check so a redundant trigger — a backup schedule
  # slot, OR a routine workflow_dispatch call from ops/trigger_workflow.sh
  # (or a hosted cron service hitting the same API — see ops/README.md) —
  # doesn't burn a real Gemini call re-doing work someone else already
  # did. Applies to BOTH schedule and workflow_dispatch by default now:
  # an earlier version of this workflow exempted all workflow_dispatch
  # runs unconditionally, on the assumption a manual dispatch always means
  # "a human deliberately wants this to run for real" — true when
  # workflow_dispatch meant an occasional manual click, false once an
  # external cron calls it routinely every day. Use the `force` input
  # (default false) to explicitly bypass this check when you really do
  # want to regenerate today's forecast by hand.
  check:
    runs-on: ubuntu-latest
    outputs:
      already_done: ${{ steps.check.outputs.already_done }}
    steps:
      - uses: actions/checkout@v7
      - name: Check if today's forecast already exists
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "data/log/${TODAY}.json" ]; then
            echo "data/log/${TODAY}.json already exists — an earlier slot today (or a manual run) already produced it. Skipping."
            echo "already_done=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_done=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: check
    if: needs.check.outputs.already_done != 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Determine public Pages URL
        id: pages_url
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "url=https://${OWNER,,}.github.io/${REPO,,}/" >> "$GITHUB_OUTPUT"

      - name: Run daily pipeline
        env:
          # --- LLM provider selection (see QUICKSTART.md) ---
          # Leave all of these unset to use Gemini, the default.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_JSON_MODE: ${{ vars.LLM_JSON_MODE }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # --- Gemini (the default provider) ---
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Which trigger produced this run. Recorded into the log entry so a
          # dead workflow_dispatch path is visible in the committed record
          # rather than hidden behind the cron slots still firing.
          TRIGGER_SOURCE: ${{ github.event_name }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          olw run-daily --public-url "${{ steps.pages_url.outputs.url }}" $DRY_RUN_FLAG

      - name: Commit and push data/docs changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "forecast: $(date -u +%Y-%m-%d)"
            git push
          fi
