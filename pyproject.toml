[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlocalweather"
version = "0.1.0"
description = "Open-source, location-agnostic daily weather forecast system with genuine multi-model synthesis and a self-improving accuracy loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Open Local Weather contributors" }]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.11",
    "freezegun>=1.4",
]

[project.scripts]
olw = "openlocalweather.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openlocalweather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on sys.path, so `from tests.test_pipeline_run import ...`
# resolves. Some test modules share fixtures and helpers with their
# neighbours and there is no other way to name one.
#
# WITHOUT THIS, `pytest` AND `python -m pytest` DISAGREE, and the disagreement
# is silent in the direction that matters. `python -m pytest` inserts the
# current directory into sys.path and the bare `pytest` console script does
# not, so a cross-module import passes locally for anyone using the module
# form and fails in CI, which runs `pytest -q`. Measured 2026-09-05: twelve
# consecutive red CI runs over two days while the suite was green on the
# machine that pushed them.
pythonpath = ["."]
