[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlocalweather"
version = "0.1.0"
description = "Open-source, location-agnostic daily weather forecast system with genuine multi-model synthesis and a self-improving accuracy loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Open Local Weather contributors" }]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.11",
    "freezegun>=1.4",
]

[project.scripts]
olw = "openlocalweather.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openlocalweather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
